name: Deploy iCanCare India Compliance App

on:
  push:
    branches:
      - icancare-custom
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production Server
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "🚀 Starting iCanCare India Compliance App Deployment..."
            
            # Create backup and deployment script with error handling
            cat > /tmp/deploy_india_compliance.sh << 'DEPLOY_SCRIPT'
            #!/bin/bash
            set -e  # Exit on any error
            
            echo "🚀 Starting India Compliance deployment with error handling..."
            
            # Function to handle errors
            handle_error() {
                echo "❌ Error occurred during India Compliance deployment!"
                echo "🔄 Rolling back changes..."
                
                # Rollback git changes
                cd /home/frappe/icancare-bench/apps/india_compliance
                git reset --hard HEAD~1 2>/dev/null || echo "No rollback needed"
                
                # Restart services to ensure stability
                sudo supervisorctl restart all || echo "Supervisor restart failed"
                sudo systemctl restart nginx || echo "Nginx restart failed"
                
                echo "🛡️ India Compliance rollback completed. Server should be stable."
                exit 1
            }
            
            # Set error trap
            trap handle_error ERR
            
            # Switch to frappe user and activate environment
            sudo su - frappe << 'EOF'
            set -e  # Exit on any error in frappe session
            source frappe-env/bin/activate
            cd icancare-bench
            
            # Check if site is accessible before deployment
            echo "🔍 Pre-deployment health check..."
            bench --site icancare.com doctor || echo "Warning: Site health check failed"
            
            # Create backup before deployment
            echo "💾 Creating backup before India Compliance deployment..."
            bench --site icancare.com backup --with-files || echo "Backup failed, continuing..."
            
            # Pull latest changes from India Compliance app
            echo "📥 Pulling latest changes for India Compliance..."
            cd apps/india_compliance
            git pull upstream icancare-custom || exit 1
            cd ../..
            
            # Build assets with error checking
            echo "🔨 Building assets..."
            bench build --force || exit 1
            
            # Migrate database if needed with error checking
            echo "⬆️ Running migrations..."
            bench migrate || exit 1
            
            # Clear all caches
            echo "🧹 Clearing caches..."
            bench --site icancare.com clear-cache || echo "Cache clear failed, continuing..."
            bench --site icancare.com clear-website-cache || echo "Website cache clear failed, continuing..."
            
            echo "✅ iCanCare India Compliance App operations completed successfully!"
            EOF
            
            echo "✅ India Compliance deployment script completed!"
            DEPLOY_SCRIPT
            
            # Make script executable and run it
            chmod +x /tmp/deploy_india_compliance.sh
            /tmp/deploy_india_compliance.sh
            
            # Restart services (production method - as ubuntu user)
            echo "🔄 Restarting production services..."
            sudo supervisorctl restart all || {
                echo "❌ Supervisor restart failed! Manual intervention needed."
                exit 1
            }
            
            sudo systemctl restart nginx || {
                echo "❌ Nginx restart failed! Manual intervention needed."
                exit 1
            }
            
            echo "✅ Services restarted successfully!"
            
            # Final health check
            echo "🏥 Final health check..."
            sleep 5  # Wait for services to start
            curl -f https://health.dev.icancare.com/api/method/ping || {
                echo "❌ Site not responding after India Compliance deployment!"
                echo "🚨 CRITICAL: Manual check required!"
                exit 1
            }
            
            echo "🎉 India Compliance deployment completed successfully and site is responding!"
            
      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "🔍 Verifying India Compliance deployment..."
            curl -f https://health.dev.icancare.com/api/method/ping || echo "❌ Server not responding"
            
            # Verify India Compliance app is installed and working
            sudo su - frappe << 'EOF'
            source frappe-env/bin/activate
            cd icancare-bench
            
            # Check if india_compliance app is properly installed
            echo "📋 Checking India Compliance app installation..."
            bench --site icancare.com list-apps | grep india_compliance || echo "❌ India Compliance app not found"
            
            # Test india compliance functionality
            echo "🧪 Testing India Compliance functionality..."
            bench --site icancare.com execute "frappe.get_installed_apps()" | grep india_compliance || echo "❌ India Compliance not in installed apps"
            
            # Check if GST settings are accessible
            echo "🇮🇳 Testing GST compliance access..."
            bench --site icancare.com execute "frappe.get_doc('DocType', 'GST Settings')" || echo "❌ GST Settings not accessible"
            EOF
            
            echo "✅ India Compliance deployment verification completed"
            
      - name: Notify Success
        if: success()
        run: |
          echo "🎉 iCanCare India Compliance App deployed successfully!"
          echo "🇮🇳 GST, E-Invoice, and Indian tax compliance updated"
          echo "🌐 Access your site at: https://health.dev.icancare.com"
          
      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ India Compliance deployment failed! Check the logs above."
          echo "🔧 Manual intervention may be required for compliance functionality."
